<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad2)"/>
  
  <!-- Abstract flowing lines -->
  <g opacity="0.15">
    <path d="M0,300 Q300,200 600,300 T1200,300" stroke="#10b981" stroke-width="2" fill="none"/>
    <path d="M0,320 Q300,220 600,320 T1200,320" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <path d="M0,340 Q300,240 600,340 T1200,340" stroke="#10b981" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Glowing accents -->
  <circle cx="200" cy="200" r="150" fill="#ef4444" opacity="0.08" filter="url(#glow2)"/>
  <circle cx="1000" cy="400" r="180" fill="#10b981" opacity="0.12" filter="url(#glow2)"/>
  
  <!-- Migration arrow visual -->
  <g transform="translate(600, 280)">
    <!-- Legacy DAM boxes (left, fading) -->
    <g transform="translate(-280, 0)" opacity="0.5">
      <rect x="-50" y="-60" width="100" height="40" rx="6" fill="#374151" stroke="#4b5563" stroke-width="1"/>
      <text x="0" y="-35" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Canto</text>
      
      <rect x="-50" y="-10" width="100" height="40" rx="6" fill="#374151" stroke="#4b5563" stroke-width="1"/>
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Brandfolder</text>
      
      <rect x="-50" y="40" width="100" height="40" rx="6" fill="#374151" stroke="#4b5563" stroke-width="1"/>
      <text x="0" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">MediaValet</text>
    </g>
    
    <!-- Arrow -->
    <g filter="url(#softGlow)">
      <path d="M-150,0 L100,0" stroke="url(#emeraldGrad2)" stroke-width="4" stroke-linecap="round"/>
      <polygon points="100,-12 130,0 100,12" fill="#10b981"/>
    </g>
    
    <!-- Zuperix (right, prominent) -->
    <g transform="translate(220, 0)">
      <rect x="-80" y="-70" width="160" height="140" rx="16" fill="url(#emeraldGrad2)" opacity="0.9" filter="url(#softGlow)"/>
      <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">ZUPERIX</text>
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">Modern DAM</text>
      
      <!-- Checkmarks -->
      <g transform="translate(-40, 40)" fill="#22c55e">
        <circle cx="0" cy="0" r="8" fill="rgba(34,197,94,0.2)"/>
        <path d="M-4,0 L-1,3 L4,-2" stroke="#22c55e" stroke-width="2" fill="none"/>
      </g>
      <text x="-25" y="44" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">AI Native</text>
      
      <g transform="translate(30, 40)" fill="#22c55e">
        <circle cx="0" cy="0" r="8" fill="rgba(34,197,94,0.2)"/>
        <path d="M-4,0 L-1,3 L4,-2" stroke="#22c55e" stroke-width="2" fill="none"/>
      </g>
      <text x="45" y="44" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Affordable</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="500" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">The Great DAM Migration</text>
  <text x="600" y="550" font-family="system-ui, sans-serif" font-size="20" fill="#a1a1aa" text-anchor="middle">Why Teams Are Switching to Modern, Affordable DAM</text>
  
  <!-- Zuperix branding -->
  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#10b981">ZUPERIX</text>
</svg>
