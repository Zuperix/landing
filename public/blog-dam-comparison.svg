<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Abstract grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#10b981" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#10b981" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#10b981" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#10b981" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#10b981" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#10b981" stroke-width="1"/>
  </g>
  
  <!-- Glowing orbs -->
  <circle cx="150" cy="150" r="100" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="480" r="120" fill="#8b5cf6" opacity="0.1" filter="url(#glow)"/>
  <circle cx="600" cy="500" r="80" fill="#f97316" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Comparison visual - Three platforms -->
  <g transform="translate(600, 280)">
    <!-- Zuperix (center, elevated) -->
    <g transform="translate(0, -60)">
      <rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#emeraldGrad)" opacity="0.9"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">ZUPERIX</text>
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">$10-99/mo</text>
      <!-- Crown icon -->
      <path d="M-15,-30 L0,-45 L15,-30 L10,-20 L-10,-20 Z" fill="#fbbf24"/>
    </g>
    
    <!-- Competitor 1 (left) -->
    <g transform="translate(-200, 40)">
      <rect x="-60" y="-40" width="120" height="80" rx="10" fill="url(#purpleGrad)" opacity="0.6"/>
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Bynder</text>
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">$1,500+/mo</text>
    </g>
    
    <!-- Competitor 2 (right) -->
    <g transform="translate(200, 40)">
      <rect x="-60" y="-40" width="120" height="80" rx="10" fill="url(#orangeGrad)" opacity="0.6"/>
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Cloudinary</text>
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">$500+/mo</text>
    </g>
    
    <!-- Connecting lines -->
    <line x1="-130" y1="40" x2="-70" y2="-10" stroke="#10b981" stroke-width="2" opacity="0.4"/>
    <line x1="130" y1="40" x2="70" y2="-10" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="520" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">The Honest DAM Comparison</text>
  <text x="600" y="570" font-family="system-ui, sans-serif" font-size="20" fill="#a1a1aa" text-anchor="middle">Zuperix vs Bynder vs Cloudinary</text>
  
  <!-- Zuperix branding -->
  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#10b981">ZUPERIX</text>
</svg>
